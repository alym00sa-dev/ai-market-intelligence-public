name: Refresh Hiring Data

on:
  schedule:
    - cron: "0 6 * * 3"   # every Wednesday 6am UTC = Tuesday ~11pm PT
  workflow_dispatch:
    inputs:
      run_scrape:
        description: "Run the scrape job (uncheck to reuse the last committed scrape and only re-run classify + summaries)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-hiring
  cancel-in-progress: false

jobs:
  # ── Job A: scrape + base classify → commit jobs.json ────────────────────────
  # Skippable via the run_scrape input, so a failed downstream step can be
  # re-run WITHOUT re-scraping (it reuses the committed scrape).
  scrape:
    if: ${{ github.event_name == 'schedule' || inputs.run_scrape }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r frontier-labs-hiring/requirements.txt
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      - name: Scrape + classify jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python frontier-labs-hiring/scraper.py --no-summarize
      - name: Commit scraped + classified jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json public/data/jobs_raw.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: refresh hiring scrape [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1

  # ── Job B: vertical/social classify + track changes → commit the DATA ───────
  # Runs after scrape, OR when scrape was intentionally skipped (recovery).
  classify:
    needs: scrape
    if: ${{ always() && needs.scrape.result != 'failure' && needs.scrape.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r frontier-labs-hiring/requirements.txt
      - name: Classify verticals + social impact
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python frontier-labs-hiring/vertical_classifier.py
      - name: Track weekly changes
        run: python frontier-labs-hiring/track_changes.py
      - name: Commit hiring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json public/data/job_ledger.json public/data/weekly_trends.json public/data/snapshots
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: refresh hiring data [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1

  # ── Job C: company summaries + shift narratives → commit SUMMARIES ──────────
  summaries:
    needs: classify
    if: ${{ always() && needs.classify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest
        run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r frontier-labs-hiring/requirements.txt
      - name: Generate company summaries + shift narrative
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python frontier-labs-hiring/run_summarizer.py
      - name: Commit summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: refresh hiring summaries [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            echo "push race, retry $i"; sleep 10
          done
          exit 1
